packages:
  - 'src/explore-education-statistics-admin'
  - 'src/explore-education-statistics-ckeditor'
  - 'src/explore-education-statistics-common'
  - 'src/explore-education-statistics-frontend'

# From pnpm 11 onwards only auth and registry settings are read from .npmrc.
# Every other setting has to live here. See https://pnpm.io/settings.

engineStrict: true

# feature parity with npm
autoInstallPeers: true

# create a flat, non-symlinked node_modules structure
# (as the project doesn't play nice with symlinks).
# see https://pnpm.io/feature-comparison for more info
shamefullyHoist: true

# exclude certain dependencies from hoisting due to
# various projects needing them present in the relative
# 'node_modules' directory in order to build properly.
hoistPattern:
  - '!react/*'
  - '!react-dom/*'
  - '!formik/*'
  - '!axios/*'

# Required for next-sitemap in Frontend:
enablePrePostScripts: true

# pnpm does not run dependency build scripts unless they are allowed here.
# These five compile or fetch a native binary and genuinely need to run.
# The rest only print donation or licence banners.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  core-js-pure: false
  es5-ext: false
  iframe-resizer: false

# Moved from the package.json "pnpm" field, which pnpm 11 no longer reads.
overrides:
  '@tanstack/query-core': 4.41.1
  '@tanstack/react-query': 4.42.0
  'cookie@<0.7.0': '>=0.7.0'
  'picomatch@4.0.0-4.0.3': 4.0.4
  'picomatch@3.0.0-3.0.1': 3.0.2
  'picomatch@<2.3.2': 2.3.2

