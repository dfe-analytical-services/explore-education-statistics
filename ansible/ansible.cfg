[defaults]
inventory = inventory.ini
roles_path = roles
# Renders multi-line task output readably rather than as one long JSON line.
result_format = yaml
display_skipped_hosts = false
interpreter_python = auto_silent
retry_files_enabled = false

[privilege_escalation]
# Several tasks install packages and edit /etc/hosts, so a sudo password is
# always needed. Prompting for it here means "ansible-playbook setup.yml" works
# without having to remember -K.
become_ask_pass = true
