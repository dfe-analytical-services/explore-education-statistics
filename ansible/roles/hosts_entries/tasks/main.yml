---
# The applications reach the SQL Server and Azurite containers by hostname, and
# Keycloak issues tokens for the ees.local domain, so all three have to resolve
# to the loopback address.
- name: Point the local service hostnames at 127.0.0.1
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - explore-education-statistics"
    block: |
      {% for host in ees_hosts_entries %}
      127.0.0.1    {{ host }}
      {% endfor %}
  become: true

- name: Note that WSL will overwrite these entries
  ansible.builtin.debug:
    msg: >-
      WSL regenerates /etc/hosts every time the distribution starts, which will
      remove the entries above. Set generateHosts = false under [network] in
      /etc/wsl.conf, or re-run with -e ees_wsl_disable_generated_hosts=true to
      have the playbook do it.
  when:
    - ees_is_wsl | bool
    - not ees_wsl_disable_generated_hosts | bool
