---
# follow: true so that the common Linux setup - a symlink from the repo out to
# an unencrypted filesystem - is stat'd as the directory it points at.
- name: Check whether the SQL Server data directory is present
  ansible.builtin.stat:
    path: "{{ ees_project_dir }}/data/ees-mssql"
    follow: true
  register: ees_mssql_data

- name: Unpack a pre-built development database
  ansible.builtin.import_tasks: seed-database.yml

- name: Re-check the SQL Server data directory
  ansible.builtin.stat:
    path: "{{ ees_project_dir }}/data/ees-mssql"
    follow: true
  register: ees_mssql_data

- name: Explain how to obtain the pre-built development database
  ansible.builtin.debug:
    msg:
      - "{{ ees_project_dir }}/data/ees-mssql does not exist, so the SQL Server"
      - "container has no data to load. The recommended setup is the pre-built"
      - "development database - ask a team member for access to the Google Drive"
      - "folder and download the latest ees-mssql-data-<n>.zip."
      - ""
      - "Drop that zip into {{ ees_project_dir }}/data and re-run this playbook."
      - "It will unpack it and give the container ownership of the result. If your"
      - "home directory is on an encrypted filesystem, tell it somewhere that is"
      - "not, and it will symlink that into place instead:"
      - ""
      - "  ansible-playbook setup.yml -e ees_mssql_extract_dir=/mnt/data"
      - ""
      - "To start from empty databases instead, re-run with"
      - "-e ees_bootstrap_bare_database=true"
  when: not ees_mssql_data.stat.exists

# The container writes its data files as this uid, and exits during startup if
# it cannot. Done with chown rather than the file module because the path is
# usually a symlink, which the file module would replace with a directory. The
# trailing slash makes chown descend into the link target.
- name: Give the SQL Server container ownership of its data directory
  ansible.builtin.command:
    cmd: "chown -R {{ ees_mssql_container_uid }} {{ ees_project_dir }}/data/ees-mssql/"
  become: true
  when:
    - ees_mssql_data.stat.exists
    - ees_mssql_data.stat.uid != ees_mssql_container_uid
  changed_when: true

- name: Bootstrap a bare SQL Server database
  ansible.builtin.import_tasks: bare-database.yml
  when: ees_bootstrap_bare_database | bool
