parameters:
  - name: DeployBranches
    displayName: Branches that should be deployed
    type: object
    default:
      - master
      - dev
      - test
  - name: IncludeTests
    displayName: Run test steps
    type: boolean
    default: true
  - name: IncludeFormattingAndLinting
    displayName: Run formatting and linting checks
    type: boolean
    default: true

variables:
  - group: EES - Build
  # The Azure DevOps instance for the DfE Enterprise Landing Zone (ELZ) subscriptions sets "elz" to "true" in its
  # "EES - Build" variable group, as its App Services run on Linux. Otherwise, the .NET App Services are built for the
  # legacy Windows ones.
  - name: AppServicePublishArguments
    value: $[ iif(eq(variables['elz'], 'true'), '--self-contained false -r linux-x64', '--self-contained true -r win-x64') ]
  - name: BuildConfiguration
    value: Release
  - name: IsBranchDeployable
    value: ${{ containsValue(parameters.DeployBranches, variables['Build.SourceBranchName']) }}
  - name: CI
    value: true
  - name: DotNetVersion
    value: '10.0.x'
  - name: NodeVersion
    value: '22.23.4'
  - name: RubyVersion
    value: '4.0.x'
  - name: PublicApiDir
    value: GovUk.Education.ExploreEducationStatistics.Public.Data.Api
  - name: PublicApiDocsDir
    value: explore-education-statistics-api-docs

trigger:
  branches:
    include:
      - master
      - dev
      - test
  paths:
    exclude:
      - infrastructure/**
      - src/GovUk.Education.ExploreEducationStatistics.Content.Search*/**
      - tests/robot-tests/tests/snapshots/**
      - renovate.json

pr:
  branches:
    include:
      - master
      - dev
      - test
  drafts: false
  paths:
    exclude:
      - infrastructure/**
      - src/GovUk.Education.ExploreEducationStatistics.Content.Search*/**
      - tests/robot-tests/tests/snapshots/**
      - renovate.json

jobs:
  - job: BackendVerify
    pool: ees-ubuntu2604-large-v2
    workspace:
      clean: all
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false

      - task: NuGetAuthenticate@1
        inputs:
          nuGetServiceConnections: $(NuGetServiceConnectionName)

      - task: UseDotNet@2
        displayName: Install .NET $(DotNetVersion)
        inputs:
          version: $(DotNetVersion)
          performMultiLevelLookup: true

      # Check code formatting
      - ${{ if eq(parameters.IncludeFormattingAndLinting, true) }}:
          - task: DotNetCoreCLI@2
            displayName: Restore .NET tools
            inputs:
              command: custom
              custom: tool
              arguments: restore

          - task: DotNetCoreCLI@2
            displayName: CSharpier check formatting
            inputs:
              command: custom
              custom: csharpier
              arguments: check .

      # Check Public API OpenAPI docs
      - task: DotNetCoreCLI@2
        displayName: Build Public API
        inputs:
          projects: '**/GovUk.Education.ExploreEducationStatistics.Public.Data.Api.csproj'
          arguments: --configuration $(BuildConfiguration)

      - task: Bash@3
        displayName: Diff Public API OpenAPI docs
        inputs:
          targetType: inline
          script: |
            docker run --rm -t \
              -v $(System.DefaultWorkingDirectory)/src/artifacts/bin/$(PublicApiDir)/${{ lower(variables.BuildConfiguration) }}:/api \
              -v $(System.DefaultWorkingDirectory)/src/$(PublicApiDocsDir):/api-docs \
              -v $(System.DefaultWorkingDirectory)/ci/scripts:/scripts \
              --entrypoint /bin/sh \
              tufin/oasdiff \
              /scripts/public-api-openapi-diff.sh

  - ${{ if eq(parameters.IncludeTests, true) }}:
      - job: BackendTests
        pool: ees-ubuntu2604-xlarge-v2
        workspace:
          clean: all
        variables:
          BackendTestResultsDirectory: $(Agent.TempDirectory)/BackendTestResults
        steps:
          - checkout: self
            fetchDepth: 1
            fetchTags: false

          - task: NuGetAuthenticate@1
            inputs:
              nuGetServiceConnections: $(NuGetServiceConnectionName)

          - task: UseDotNet@2
            displayName: Install .NET $(DotNetVersion)
            inputs:
              version: $(DotNetVersion)
              performMultiLevelLookup: true

          # Rather than running "dotnet test" once per test project in turn, the test projects in the
          # main solution are run together via a solution filter, so that they're built once and run
          # in parallel. Admin's tests are excluded, as AdminBackendTests runs them. Projects that
          # aren't in the main solution will have their own pipelines run their tests instead of this
          # one.
          - task: Bash@3
            displayName: Test
            inputs:
              targetType: inline
              workingDirectory: src
              script: |
                set -e

                solution=GovUk.Education.ExploreEducationStatistics.sln

                # Read the main solution's test projects, apart from Admin's, into the "testProjects"
                # array, one project path per element ("-t" strips each line's trailing newline).
                mapfile -t testProjects < <(dotnet sln "$solution" list \
                  | grep -E '[Tt]ests\.csproj$' \
                  | grep -v '/GovUk\.Education\.ExploreEducationStatistics\.Admin\.Tests\.csproj$')

                jq -n --arg solution "$solution" \
                  '{solution: {path: $solution, projects: $ARGS.positional}}' \
                  --args "${testProjects[@]}" > BackendTests.slnf

                echo "Running ${#testProjects[@]} test projects together:"
                printf '  %s\n' "${testProjects[@]}"

                dotnet test BackendTests.slnf \
                  --configuration $(BuildConfiguration) \
                  --logger trx \
                  --results-directory "$(BackendTestResultsDirectory)"

          - task: PublishTestResults@2
            displayName: Publish backend test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '*.trx'
              searchFolder: $(BackendTestResultsDirectory)
              testRunTitle: Backend tests
              mergeTestResults: true

  # Only packages the apps when they'll be deployed, or when BackendTests isn't running and this is
  # the only check that they compile. Otherwise, BackendTests' builds of the test projects already
  # compile every app packaged here.
  #
  # This runs on a self-hosted xlarge agent rather than a Microsoft-hosted one, as packaging the apps
  # is CPU-bound and was the slowest job in the pipeline on the latter's 2 vCPUs.
  - job: BackendPublish
    pool: ees-ubuntu2604-xlarge-v2
    workspace:
      clean: all
    condition: or(eq(variables.IsBranchDeployable, true), eq('${{ parameters.IncludeTests }}', 'false'))
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false

      - task: NuGetAuthenticate@1
        inputs:
          nuGetServiceConnections: $(NuGetServiceConnectionName)

      - task: UseDotNet@2
        displayName: Install .NET $(DotNetVersion)
        inputs:
          version: $(DotNetVersion)
          performMultiLevelLookup: true

      - task: DotNetCoreCLI@2
        displayName: Package Analytics Function App
        inputs:
          command: publish
          publishWebProjects: false
          projects: '**/GovUk.Education.ExploreEducationStatistics.Analytics.Consumer.csproj'
          arguments: --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/analytics-function-app
          zipAfterPublish: True

      - task: PublishPipelineArtifact@1
        displayName: Publish Analytics Function App artifact
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          artifactName: analytics-function-app
          targetPath: $(Build.ArtifactStagingDirectory)/analytics-function-app

      - task: DotNetCoreCLI@2
        displayName: Package Data API
        inputs:
          command: publish
          publishWebProjects: false
          projects: '**/GovUk.Education.ExploreEducationStatistics.Data.Api.csproj'
          arguments: $(AppServicePublishArguments) --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/data-api
          zipAfterPublish: True

      - task: PublishPipelineArtifact@1
        displayName: Publish Data API artifact
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          artifactName: data-api
          targetPath: $(Build.ArtifactStagingDirectory)/data-api

      - task: DotNetCoreCLI@2
        displayName: Package Content API
        inputs:
          command: publish
          publishWebProjects: false
          projects: '**/GovUk.Education.ExploreEducationStatistics.Content.Api.csproj'
          arguments: $(AppServicePublishArguments) --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/content-api
          zipAfterPublish: True

      - task: PublishPipelineArtifact@1
        displayName: Publish Content API artifact
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          artifactName: content-api
          targetPath: $(Build.ArtifactStagingDirectory)/content-api

      - task: DotNetCoreCLI@2
        displayName: Package Public API
        inputs:
          command: publish
          publishWebProjects: false
          projects: '**/GovUk.Education.ExploreEducationStatistics.Public.Data.Api.csproj'
          arguments: -r linux-musl-x64 --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/public-api
          zipAfterPublish: False
      - task: Docker@2
        displayName: Build Public API Docker image
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          containerRegistry: $(AcrServiceConnection)
          repository: ees-public-api/api
          command: build
          Dockerfile: docker/public-api/Dockerfile
          buildContext: $(Build.ArtifactStagingDirectory)/public-api/GovUk.Education.ExploreEducationStatistics.Public.Data.Api
          tags: $(Build.BuildNumber)
          arguments: --build-arg BUILD_BUILDNUMBER=$(Build.BuildNumber)
        env:
          DOCKER_BUILDKIT: 1

      - task: Docker@2
        displayName: Push Public API Docker image
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          containerRegistry: $(AcrServiceConnection)
          repository: ees-public-api/api
          command: push
          tags: $(Build.BuildNumber)

      - task: DotNetCoreCLI@2
        displayName: Package Public API Data Processor Function
        inputs:
          command: publish
          publishWebProjects: false
          includeRootFolder: false
          projects: '**/GovUk.Education.ExploreEducationStatistics.Public.Data.Processor.csproj'
          arguments: --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/public-api-data-processor
          zipAfterPublish: True

      - task: PublishPipelineArtifact@1
        displayName: Publish Public API Data Processor artifact
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          artifactName: public-api-data-processor
          targetPath: $(Build.ArtifactStagingDirectory)/public-api-data-processor

      - task: DotNetCoreCLI@2
        displayName: Package Notifier Function
        inputs:
          command: publish
          publishWebProjects: false
          projects: '**/GovUk.Education.ExploreEducationStatistics.Notifier.csproj'
          arguments: --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/notifier
          zipAfterPublish: True

      - task: PublishPipelineArtifact@1
        displayName: Publish Notifier artifact
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          artifactName: notifier
          targetPath: $(Build.ArtifactStagingDirectory)/notifier

      - task: DotNetCoreCLI@2
        displayName: Package Publisher Function
        inputs:
          command: publish
          publishWebProjects: false
          projects: '**/GovUk.Education.ExploreEducationStatistics.Publisher.csproj'
          arguments: --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/publisher
          zipAfterPublish: True

      - task: PublishPipelineArtifact@1
        displayName: Publish Publisher artifact
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          artifactName: publisher
          targetPath: $(Build.ArtifactStagingDirectory)/publisher

      - task: DotNetCoreCLI@2
        displayName: Package Processor Function
        inputs:
          command: publish
          publishWebProjects: false
          projects: '**/GovUk.Education.ExploreEducationStatistics.Data.Processor.csproj'
          arguments: --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/processor
          zipAfterPublish: True

      - task: PublishPipelineArtifact@1
        displayName: Publish Processor artifact
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          artifactName: processor
          targetPath: $(Build.ArtifactStagingDirectory)/processor

  # Admin is built and packaged alongside its checks (AdminChecks, CommonChecks and
  # AdminBackendTests) rather than after them, so that packaging doesn't add to the length of the
  # run. A failure in any of them still fails the run, which prevents the release pipeline from
  # deploying it.
  - job: AdminBuild
    pool: ees-ubuntu2604-xlarge-v2
    workspace:
      clean: all
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false

      - template: azure-pipelines-install-node-dependencies.yml

      - task: NuGetAuthenticate@1
        inputs:
          nuGetServiceConnections: $(NuGetServiceConnectionName)

      - task: UseDotNet@2
        displayName: Install .NET $(DotNetVersion)
        inputs:
          version: $(DotNetVersion)
          performMultiLevelLookup: true

      # Only needed when nothing else compiles Admin's .NET code - otherwise "Package Admin app" below
      # compiles it on deployable branches, and AdminBackendTests does when tests are running.
      - task: DotNetCoreCLI@2
        displayName: Build
        condition: and(succeeded(), ne(variables.IsBranchDeployable, true), eq('${{ parameters.IncludeTests }}', 'false'))
        inputs:
          projects: '**/GovUk.Education.ExploreEducationStatistics.Admin.csproj'
          arguments: --configuration $(BuildConfiguration)

      - task: Bash@3
        displayName: pnpm run build
        inputs:
          targetType: inline
          script: pnpm --filter=explore-education-statistics-admin run build

      - task: CopyFiles@2
        displayName: Copy files to wwwroot
        inputs:
          SourceFolder: src/explore-education-statistics-admin/build
          TargetFolder: src/GovUk.Education.ExploreEducationStatistics.Admin/wwwroot

      - task: DotNetCoreCLI@2
        displayName: Package Admin app
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          command: publish
          publishWebProjects: false
          projects: '**/GovUk.Education.ExploreEducationStatistics.Admin.csproj'
          arguments: $(AppServicePublishArguments) --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)/admin
          zipAfterPublish: True

      - task: PublishPipelineArtifact@1
        displayName: Publish Admin artifact
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          artifactName: admin
          targetPath: $(Build.ArtifactStagingDirectory)/admin

  - ${{ if eq(parameters.IncludeTests, true) }}:
      - job: AdminBackendTests
        pool: ees-ubuntu2604-xlarge-v2
        workspace:
          clean: all
        steps:
          - checkout: self
            fetchDepth: 1
            fetchTags: false

          - task: NuGetAuthenticate@1
            inputs:
              nuGetServiceConnections: $(NuGetServiceConnectionName)

          - task: UseDotNet@2
            displayName: Install .NET $(DotNetVersion)
            inputs:
              version: $(DotNetVersion)
              performMultiLevelLookup: true

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: '**/GovUk.Education.ExploreEducationStatistics.Admin.Tests.csproj'
              arguments: --configuration $(BuildConfiguration) --collect "Code coverage"

  # The frontend checks are split into one job per area of the pnpm monorepo, running in parallel
  # with the Admin and public site builds. CommonChecks covers the common workspace along with
  # everything else outside of Admin and the public site.
  - template: azure-pipelines-frontend-checks-job.yml
    parameters:
      jobName: AdminChecks
      # One of the quicker jobs, so it runs on a large agent, leaving the xlarge agents free for the
      # slower ones.
      pool: ees-ubuntu2604-large-v2
      includeFormattingAndLinting: ${{ parameters.IncludeFormattingAndLinting }}
      includeTests: ${{ parameters.IncludeTests }}
      typeCheckScript: pnpm --filter=explore-education-statistics-admin tsc
      lintScript: >-
        pnpm exec eslint --ext .ts,.tsx,.js,.jsx src/explore-education-statistics-admin &&
        pnpm exec stylelint "src/explore-education-statistics-admin/**/*.{scss,css}"
      formatCheckScript: >-
        pnpm exec prettier --list-different
        "src/explore-education-statistics-admin/**/*.{js,jsx,ts,tsx,css,scss,html}"
      testScript: pnpm --filter=explore-education-statistics-admin test:ci
      testResultsFiles: explore-education-statistics-admin/junit-*.xml
      testRunTitle: Admin Jest tests

  - template: azure-pipelines-frontend-checks-job.yml
    parameters:
      jobName: PublicSiteChecks
      # One of the quicker jobs, so it runs on a large agent, leaving the xlarge agents free for the
      # slower ones.
      pool: ees-ubuntu2604-large-v2
      includeFormattingAndLinting: ${{ parameters.IncludeFormattingAndLinting }}
      includeTests: ${{ parameters.IncludeTests }}
      typeCheckScript: pnpm --filter=explore-education-statistics-frontend tsc
      lintScript: >-
        pnpm exec eslint --ext .ts,.tsx,.js,.jsx src/explore-education-statistics-frontend &&
        pnpm exec stylelint "src/explore-education-statistics-frontend/**/*.{scss,css}"
      formatCheckScript: >-
        pnpm exec prettier --list-different
        "src/explore-education-statistics-frontend/**/*.{js,jsx,ts,tsx,css,scss,html}"
      testScript: pnpm --filter=explore-education-statistics-frontend test:ci
      testResultsFiles: explore-education-statistics-frontend/junit-*.xml
      testRunTitle: Public site Jest tests

  - template: azure-pipelines-frontend-checks-job.yml
    parameters:
      jobName: CommonChecks
      # One of the quicker jobs, so it runs on a large agent, leaving the xlarge agents free for the
      # slower ones.
      pool: ees-ubuntu2604-large-v2
      includeFormattingAndLinting: ${{ parameters.IncludeFormattingAndLinting }}
      includeTests: ${{ parameters.IncludeTests }}
      typeCheckScript: pnpm --filter=explore-education-statistics-common tsc
      lintScript: >-
        pnpm exec eslint --ext .ts,.tsx,.js,.jsx .
        --ignore-pattern "src/explore-education-statistics-admin/"
        --ignore-pattern "src/explore-education-statistics-frontend/" &&
        pnpm exec stylelint "src/**/*.{scss,css}"
        --ignore-pattern "src/explore-education-statistics-admin/**"
        --ignore-pattern "src/explore-education-statistics-frontend/**"
      formatCheckScript: >-
        pnpm exec prettier --list-different "**/*.{js,jsx,ts,tsx,css,scss,html}"
        "!src/explore-education-statistics-admin/**"
        "!src/explore-education-statistics-frontend/**"
      testScript: pnpm --filter=explore-education-statistics-common test:ci
      testResultsFiles: explore-education-statistics-common/junit-*.xml
      testRunTitle: Common Jest tests

  - job: PublicSiteBuild
    pool: ees-ubuntu2604-xlarge-v2
    workspace:
      clean: all
    variables:
      PublicSiteDirectory: $(System.DefaultWorkingDirectory)/src/explore-education-statistics-frontend
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false

      - template: azure-pipelines-install-node-dependencies.yml

      - task: Cache@2
        displayName: Cache Next.js build
        inputs:
          key: 'next | "$(Agent.OS)" | pnpm-lock.yaml | $(Build.SourceVersion)'
          path: $(PublicSiteDirectory)/.next/cache
          restoreKeys: |
            next | "$(Agent.OS)" | pnpm-lock.yaml
            next | "$(Agent.OS)"

      # Type checking is skipped here, as the PublicSiteChecks job covers it.
      - task: Bash@3
        displayName: pnpm run build
        inputs:
          targetType: inline
          script: pnpm --filter=explore-education-statistics-frontend run build
        env:
          TYPE_CHECK_DISABLE: true

      # The image packages the build output above, rather than building the site again.
      - task: Docker@2
        displayName: Build Public frontend Docker image
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          containerRegistry: $(AcrServiceConnection)
          repository: ees-public-frontend
          command: build
          Dockerfile: docker/public-frontend/Dockerfile
          buildContext: $(System.DefaultWorkingDirectory)
          tags: $(Build.BuildNumber)
        env:
          DOCKER_BUILDKIT: 1

      - task: Docker@2
        displayName: Push Public frontend Docker image
        condition: and(succeeded(), eq(variables.IsBranchDeployable, true))
        inputs:
          containerRegistry: $(AcrServiceConnection)
          repository: ees-public-frontend
          command: push
          tags: $(Build.BuildNumber)

  - job: ApiDocs
    pool:
      vmImage: ubuntu-22.04
    workspace:
      clean: all
    variables:
      WorkingDirectory: src/explore-education-statistics-api-docs
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false

      - task: UseNode@1
        displayName: Install Node.js $(NodeVersion)
        inputs:
          version: $(NodeVersion)

      - task: UseRubyVersion@0
        displayName: Install Ruby $(RubyVersion)
        inputs:
          versionSpec: '$(RubyVersion)'

      - task: Cache@2
        displayName: Cache Gems
        inputs:
          key: 'gems | "$(Agent.OS)" | $(WorkingDirectory)/Gemfile.lock'
          path: $(WorkingDirectory)/vendor
          restoreKeys: |
            gems | "$(Agent.OS)"
            gems

      - task: Bash@3
        displayName: Set deployment config
        inputs:
          workingDirectory: $(WorkingDirectory)
          targetType: inline
          script: bundle config set deployment true

      - task: Bash@3
        displayName: Install Gems
        inputs:
          workingDirectory: $(WorkingDirectory)
          targetType: inline
          script: bundle install

      - task: Bash@3
        displayName: Build
        inputs:
          workingDirectory: $(WorkingDirectory)
          targetType: inline
          script: |
            set -e
            bundle exec middleman build
            # Remove afterwards as we don't want it in the artifact
            rm -rf build

      - task: PublishPipelineArtifact@1
        displayName: Publish Public API docs artifact
        inputs:
          artifactName: public-api-docs
          targetPath: $(System.DefaultWorkingDirectory)/src/$(PublicApiDocsDir)

  - job: MiscellaneousArtifacts
    pool:
      vmImage: ubuntu-22.04
    workspace:
      clean: all
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false

      - task: CopyFiles@2
        displayName: Copy Pipfiles to tests
        inputs:
          Contents: |
            Pipfile
            Pipfile.lock
          TargetFolder: tests

      - task: PublishPipelineArtifact@0
        displayName: Publish test files
        inputs:
          artifactName: tests
          targetPath: tests
