name: CodeQL
on:
  push:
    branches:
      - dev
  workflow_dispatch:
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Credentials are written to a NuGet config outside the checkout, which NuGet picks up
    # from the parent directory hierarchy.
    - name: Install .NET and authenticate with GitHub Packages
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        source-url: https://nuget.pkg.github.com/dfe-analytical-services/index.json
        config-file: src/nuget.config
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
