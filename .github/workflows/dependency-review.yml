name: 'Dependency Review'
on: 
  workflow_dispatch:
  pull_request:
    branches: [ dev, master ]
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5.0.0
        with:
          allow-ghsas: GHSA-wrjc-x8rr-h8h6, GHSA-337j-9hxr-rhxg
