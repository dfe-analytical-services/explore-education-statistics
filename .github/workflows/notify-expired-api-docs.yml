name: Notify expired API docs
on:
  # Schedule disabled until a notification channel is configured (EES-7608).
  # schedule:
  #   - cron: '5 12 * * 1-5'  # 12:05 UTC, Monday to Friday
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (logs the message that would be sent; no notification channel is configured yet)
        required: false
        default: true
        type: boolean

jobs:
  notify-expired-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: src/explore-education-statistics-api-docs

      - name: Notify expired docs
        working-directory: src/explore-education-statistics-api-docs
        run: bundle exec rake notify:expired
        env:
          HOST_URL: ${{ vars.API_DOCS_URL }}
