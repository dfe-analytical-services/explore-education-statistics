parameters:
  - name: action
    type: string
    default: create
    values:
      - create
      - validate
  - name: displayName
    type: string
  - name: serviceConnection
    type: string
  - name: subscriptionId
    type: string
  - name: resourceGroupName
    type: string
  - name: parameterFile
    type: string
  - name: adminProdAppSettings
    type: string
    default: '{}'
  - name: adminDeploySlotAppSettings
    type: string
    default: '{}'
  - name: contentApiProdAppSettings
    type: string
    default: '{}'
  - name: contentApiDeploySlotAppSettings
    type: string
    default: '{}'
  - name: dataApiProdAppSettings
    type: string
    default: '{}'
  - name: dataApiDeploySlotAppSettings
    type: string
    default: '{}'

steps:
  - task: BicepDeploy@0
    displayName: ${{ parameters.displayName }}
    inputs:
      operation: ${{ parameters.action }}
      validationLevel: template
      name: MainInfrastructure$(Build.BuildNumber)-${{ parameters.action }}
      azureResourceManagerConnection: ${{ parameters.serviceConnection }}
      subscriptionId: ${{ parameters.subscriptionId }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      templateFile: $(templateFile)
      parametersFile: ${{ parameters.parameterFile }}
      parameters: |
        tags: $(resourceTags)
        environmentPipelineVariables:
          maintenanceIpRanges: $(maintenanceFirewallRules)
        adminProdAppSettings: ${{ parameters.adminProdAppSettings }}
        adminDeploySlotAppSettings: ${{ parameters.adminDeploySlotAppSettings }}
        contentApiProdAppSettings: ${{ parameters.contentApiProdAppSettings }}
        contentApiDeploySlotAppSettings: ${{ parameters.contentApiDeploySlotAppSettings }}
        dataApiProdAppSettings: ${{ parameters.dataApiProdAppSettings }}
        dataApiDeploySlotAppSettings: ${{ parameters.dataApiDeploySlotAppSettings }}