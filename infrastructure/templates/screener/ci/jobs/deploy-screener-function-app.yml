parameters:
  - name: serviceConnection
    type: string
  - name: environment
    type: string
  - name: dependsOn
    type: object
    default: []

jobs:
  - deployment: DeployScreenerFunction
    displayName: Deploy Screener Function
    dependsOn: ${{ parameters.dependsOn }}
    environment: ${{ parameters.environment }}
    pool:
      vmImage: $(vmImageName)

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            fetchDepth: 1
            sparseCheckoutDirectories: infrastructure/templates/common

          - template: ../../../../common/ci/tasks/get-resource-names.yml
            parameters:
              environment: ${{ parameters.environment }}

          - template: ../../../../common/ci/tasks/bicep-output-variables.yml
            parameters:
              serviceConnection: ${{ parameters.serviceConnection }}

          - template: ../../../../common/ci/tasks/get-key-vault-secret.yml
            parameters:
              serviceConnection: ${{ parameters.serviceConnection }}
              keyVaultName: $(resourceNames.keyVault.keyVault)
              secretName: ees-screener-app-registration-client-id
              variableName: screenerAppRegistrationClientId

          - template: ../../../public-api/ci/tasks/wait-for-endpoint-result.yml
            parameters:
              serviceConnection: ${{ parameters.serviceConnection }}
              displayName: Check the Screener API Function App is healthy after deployment
              endpoint: '$(screenerFunctionAppUrl)/api/healthcheck'
              accessTokenScope: $(screenerAppRegistrationClientId)
              maxAttempts: 50
