parameters:
  - name: serviceConnection
    type: string
  - name: environment
    type: string
  - name: bicepParamFile
    type: string

jobs:
  - deployment: DeploySearchInfrastructure
    displayName: Deploy Search Infrastructure
    environment: ${{ parameters.environment }}
    variables:
      - group: Common - ${{ parameters.environment }}
      - name: templateDirectory
        value: $(Build.SourcesDirectory)/infrastructure/templates/search
      - name: templateFile
        value: $(templateDirectory)/main.bicep
      - name: paramDirectory
        value: $(templateDirectory)/parameters
      - name: paramFile
        value: $(paramDirectory)/main-${{ parameters.bicepParamFile }}.bicepparam
      # 'Release' variables
      - name: searchServiceReleaseIndexName
        value: 'index-1'
      - name: searchServiceReleaseIndexDefinitionFilePath
        value: $(templateDirectory)/application/indexes/search/${{ variables.searchServiceReleaseIndexName }}.json
      - name: searchServiceReleaseIndexerName
        value: ${{ variables.searchServiceReleaseIndexName }}-indexer
      - name: searchServiceReleaseIndexerParsingMode
        value: 'default'
      - name: searchServiceReleaseIndexerOutputFieldMappingsFilePath
        value: $(templateDirectory)/application/indexer-output-field-mappings/search/${{ variables.searchServiceReleaseIndexName }}.json
      # 'Dataset' variables
      - name: searchServiceDatasetIndexName
        value: 'nl-search-dataset-index'
      - name: searchServiceDatasetIndexDefinitionFilePath
        value: $(templateDirectory)/application/indexes/nl-search/${{ variables.searchServiceDatasetIndexName }}.json
      - name: searchServiceDatasetIndexerName
        value: ${{ variables.searchServiceDatasetIndexName }}-indexer
      - name: searchServiceDatasetIndexerParsingMode
        value: 'json'
      # 'Filter' variables
      - name: searchServiceFilterIndexName
        value: 'nl-search-filter-index'
      - name: searchServiceFilterIndexDefinitionFilePath
        value: $(templateDirectory)/application/indexes/nl-search/${{ variables.searchServiceFilterIndexName }}.json
      - name: searchServiceFilterIndexerName
        value: ${{ variables.searchServiceFilterIndexName }}-indexer
      - name: searchServiceFilterIndexerParsingMode
        value: 'json'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - template: ../../../../common/ci/tasks/choose-elz-or-legacy-bicepparam-files.yml

            - download: none

            - template: ../../../../common/ci/tasks/update-azure-cli-and-extensions.yml

            - template: ../tasks/deploy-bicep.yml
              parameters:
                displayName: Validate Bicep template
                action: validate
                serviceConnection: ${{ parameters.serviceConnection }}
                parameterFile: $(paramFile)
                searchServiceFilterIndexName: ${{ variables.searchServiceFilterIndexName }}
                searchServiceDatasetIndexName: ${{ variables.searchServiceDatasetIndexName }}
                searchServiceReleaseIndexerName: ${{ variables.searchServiceReleaseIndexerName }}
                searchServiceDatasetIndexerName: ${{ variables.searchServiceDatasetIndexerName }}

            - template: ../tasks/deploy-bicep.yml
              parameters:
                displayName: Deploy Bicep template
                action: create
                serviceConnection: ${{ parameters.serviceConnection }}
                parameterFile: $(paramFile)
                searchServiceFilterIndexName: ${{ variables.searchServiceFilterIndexName }}
                searchServiceDatasetIndexName: ${{ variables.searchServiceDatasetIndexName }}
                searchServiceReleaseIndexerName: ${{ variables.searchServiceReleaseIndexerName }}
                searchServiceDatasetIndexerName: ${{ variables.searchServiceDatasetIndexerName }}

            - template: ../../../../common/ci/tasks/bicep-output-variables.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}

            # Deploy Azure AI Search index/indexer/data source configuration for 'Release' documents
            - template: ../tasks/deploy-search-service-config.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                indexCorsAllowedOrigins:
                  - $(publicSiteUrl)
                  - 'http://localhost:3000'
                dataSourceConnectionString: $(searchStorageAccountManagedIdentityConnectionString)
                dataSourceContainerName: $(releaseDocumentsContainerName)
                indexName: ${{ variables.searchServiceReleaseIndexName }}
                indexDefinitionFilePath: ${{ variables.searchServiceReleaseIndexDefinitionFilePath }}
                indexerName: ${{ variables.searchServiceReleaseIndexerName }}
                indexerOutputFieldMappingsFilePath: ${{ variables.searchServiceReleaseIndexerOutputFieldMappingsFilePath }}
                indexerParsingMode: ${{ variables.searchServiceReleaseIndexerParsingMode }}
                searchServiceEndpoint: $(searchServiceEndpoint)

            # Deploy Azure AI Search index/indexer/data source configuration for 'Dataset' documents
            - template: ../tasks/deploy-search-service-config.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                indexCorsAllowedOrigins:
                  - $(publicSiteUrl)
                  - 'http://localhost:3000'
                dataSourceConnectionString: $(searchStorageAccountManagedIdentityConnectionString)
                dataSourceContainerName: $(datasetDocumentsContainerName)
                indexName: ${{ variables.searchServiceDatasetIndexName }}
                indexDefinitionFilePath: ${{ variables.searchServiceDatasetIndexDefinitionFilePath }}
                indexerName: ${{ variables.searchServiceDatasetIndexerName }}
                indexerParsingMode: ${{ variables.searchServiceDatasetIndexerParsingMode }}
                searchServiceEndpoint: $(searchServiceEndpoint)

            # Deploy Azure AI Search index/indexer/data source configuration for 'Filter' documents
            - template: ../tasks/deploy-search-service-config.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                indexCorsAllowedOrigins:
                  - $(publicSiteUrl)
                  - 'http://localhost:3000'
                dataSourceConnectionString: $(searchStorageAccountManagedIdentityConnectionString)
                dataSourceContainerName: $(filterDocumentsContainerName)
                indexName: ${{ variables.searchServiceFilterIndexName }}
                indexDefinitionFilePath: ${{ variables.searchServiceFilterIndexDefinitionFilePath }}
                indexerName: ${{ variables.searchServiceFilterIndexerName }}
                indexerParsingMode: ${{ variables.searchServiceFilterIndexerParsingMode }}
                searchServiceEndpoint: $(searchServiceEndpoint)