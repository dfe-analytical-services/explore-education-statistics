# In a new environment, the infrastructure pipelines must first run in this order, as each uses resources that earlier
# ones create, such as file shares to mount and the main apps' user-assigned identities:
#   1. Core, with Front Door (and Data Factory) but not Application Gateway.
#   2. Analytics and Search, in either order.
#   3. Public API, with the PostgreSQL Flexible Server but not the Container App or Data Processor, which allow
#      calls from Admin's identity. Then add the PostgreSQL users manually.
#   4. Main (bicep-main-infrastructure-release), which mounts the Analytics and Public API file shares.
#   5. Public API again, with the Container App and Data Processor.
#   6. Screener, Data Factory pipelines, and Core again with Application Gateway, which routes to the Public API
#      Container App.
# This is the Core pipeline: steps 1 and 6.

trigger:
  branches:
    include:
      - master
      - dev
      - test
  paths:
    include:
      - infrastructure/templates/common/**
      - infrastructure/templates/core/**

pr: none

parameters:
  - name: deploySubnets
    displayName: Do subnets need creating or updating?
    type: string
    values:
      - Yes
      - No
    default: No
  - name: deployPrivateDnsZones
    displayName: Do Private DNS Zones need creating or updating?
    type: string
    values:
      - Yes
      - No
    default: No
  - name: deployAzureFrontDoor
    displayName: Does Azure Front Door need creating or updating?
    type: string
    values:
      - Yes
      - No
    default: No
  - name: deployApplicationGateway
    displayName: Does Application Gateway need creating or updating?
    type: string
    values:
      - Yes
      - No
    default: No
  - name: deployDataFactory
    displayName: Does Data Factory need creating or updating?
    type: string
    values:
      - Yes
      - No
    default: No  
  - name: deployContainerRegistry
    displayName: Does the Container Registry need creating or updating?
    type: string
    values:
      - Yes
      - No
    default: No  
  - name: deployRecoveryServicesVault
    displayName: Does Recovery Services Vault or its policies need creating or updating?
    type: string
    values:
      - Yes
      - No
    default: No
  - name: deployAlerts
    displayName: Do the Azure Monitor alerts need creating or updating?
    type: string
    values:
      - Yes
      - No
    default: No
  - name: forceDeployToEnvironment
    displayName: Set to either dev or test to force a deploy to that environment from the chosen branch.
    type: string
    values:
      - none
      - dev
      - test
      - preprod
    default: none

variables:
  - group: Common
  - name: forceDeployToEnvironment
    value: ${{parameters.forceDeployToEnvironment}}
  - name: isDev
    value: $[or(eq(variables['forceDeployToEnvironment'], 'dev'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))]
  - name: isTest
    value: $[or(eq(variables['forceDeployToEnvironment'], 'test'), eq(variables['Build.SourceBranch'], 'refs/heads/test'))]
  - name: isPreProd
    value: $[or(eq(variables['forceDeployToEnvironment'], 'preprod'), eq(variables['Build.SourceBranch'], 'refs/heads/master'))]
  - name: isMaster
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  - name: vmImageName
    value: ubuntu-latest
  - name: deploySubnets
    value: ${{ iif(eq(parameters.deploySubnets, 'Yes'), true, false) }}
  - name: deployPrivateDnsZones
    value: ${{ iif(eq(parameters.deployPrivateDnsZones, 'Yes'), true, false) }}
  - name: deployAzureFrontDoor
    value: ${{ iif(eq(parameters.deployAzureFrontDoor, 'Yes'), true, false) }}
  - name: deployApplicationGateway
    value: ${{ iif(eq(parameters.deployApplicationGateway, 'Yes'), true, false) }}
  - name: deployDataFactory
    value: ${{ iif(eq(parameters.deployDataFactory, 'Yes'), true, false) }}
  - name: deployContainerRegistry
    value: ${{ iif(eq(parameters.deployContainerRegistry, 'Yes'), true, false) }}
  - name: deployRecoveryServicesVault
    value: ${{ iif(eq(parameters.deployRecoveryServicesVault, 'Yes'), true, false) }}
  - name: deployAlerts
    value: ${{ iif(eq(parameters.deployAlerts, 'Yes'), true, false) }}

pool:
  vmImage: $(vmImageName)

stages:
  - template: stages/deploy.yml
    parameters:
      stageName: DeployDev
      condition: eq(variables.isDev, true)
      environment: Dev
      serviceConnection: $(serviceConnectionDev)
      bicepParamFile: dev

  - template: stages/deploy.yml
    parameters:
      stageName: DeployTest
      condition: eq(variables.isTest, true)
      environment: Test
      serviceConnection: $(serviceConnectionTest)
      bicepParamFile: test

  - template: stages/deploy.yml
    parameters:
      stageName: DeployPreProd
      condition: eq(variables.isPreProd, true)
      environment: Pre-Prod
      serviceConnection: $(serviceConnectionPreProd)
      bicepParamFile: preprod

  - template: stages/deploy.yml
    parameters:
      stageName: DeployProd
      condition:  and(succeeded(), eq(variables.isMaster, true))
      dependsOn: DeployPreProd
      environment: Prod
      serviceConnection: $(serviceConnectionProd)
      bicepParamFile: prod
