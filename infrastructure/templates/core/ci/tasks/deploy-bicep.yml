parameters:
  - name: action
    type: string
    default: create
    values:
      - create
      - validate
  - name: displayName
    type: string
  - name: serviceConnection
    type: string
  - name: parameterFile
    type: string
  - name: deploySubnets
    type: string
  - name: deployPrivateDnsZones
    type: string
  - name: deployAzureFrontDoor
    type: string
  - name: deployApplicationGateway
    type: string
  - name: deployAlerts
    type: string

steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayName }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -e

        az deployment group ${{ parameters.action }} \
          --name $(infraDeployName) \
          --resource-group $(resourceGroupName) \
          --template-file $(templateFile) \
          --parameters ${{ parameters.parameterFile }} \
          --parameters \
              subscription='$(subscription)' \
              publicSiteUrl='$(publicSiteUrl)' \
              deploySubnets=${{ parameters.deploySubnets }} \
              deployPrivateDnsZones=${{ parameters.deployPrivateDnsZones }} \
              deployAzureFrontDoor=${{ parameters.deployAzureFrontDoor }} \
              deployApplicationGateway=${{ parameters.deployApplicationGateway }} \
              deployAlerts=${{ parameters.deployAlerts }} \
              resourceTags='$(resourceTags)'
