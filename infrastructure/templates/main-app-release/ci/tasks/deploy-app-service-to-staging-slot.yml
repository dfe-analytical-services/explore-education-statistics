parameters:
  - name: serviceConnection
    type: string
  - name: displayNamePrefix
    type: string
  - name: appName
    type: string
  - name: resourceGroupName
    type: string
  - name: artifactZipPath
    type: string
  - name: healthCheckPath
    type: string
    default: /api/health
  # A JSON representation of the appsettings to apply to the staging slot.
  - name: appSettingsJson
    type: string
    default: '{}'
  # A marker unique to this deploy, already baked into appSettingsJson's
  # Deploy__DeployedAt entry - see deploy-admin.yml/deploy-content-api.yml/
  # deploy-data-api.yml. Used to confirm the new appsettings/code actually took effect.
  - name: deployedAt
    type: string

steps:
  - template: ../../../../common/ci/tasks/set-appsettings-from-json.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - updating staging slot app settings
      appName: ${{ parameters.appName }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      appSettingsJson: ${{ parameters.appSettingsJson }}
      slotName: deploy

  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - Deploy code to staging slot
    retryCountOnTaskFailure: 3
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        az webapp deploy \
          --name ${{ parameters.appName }} \
          --resource-group ${{ parameters.resourceGroupName }} \
          --slot deploy \
          --type zip \
          --src-path "${{ parameters.artifactZipPath }}"

  # Confirm the staging slot app service has actually restarted by waiting for it to
  # report back this deploy's marker.
  - template: ../../../../common/ci/tasks/wait-for-app-service-restart.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - Confirming staging slot has restarted
      appName: ${{ parameters.appName }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      slotName: deploy
      healthCheckPath: ${{ parameters.healthCheckPath }}
      deployedAt: ${{ parameters.deployedAt }}
      pollingDelaySeconds: 1
      maxAttempts: 60

  # Confirm the staging slot app service is healthy after the restart.
  - template: ../../../public-api/ci/tasks/wait-for-endpoint-result.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - Checking staging slot is healthy after appsettings and code deploy
      endpoint: https://${{ parameters.appName }}-deploy.azurewebsites.net${{ parameters.healthCheckPath }}
      maxAttempts: 20
