parameters:
  - name: serviceConnection
    type: string
  - name: displayNamePrefix
    type: string
  - name: appName
    type: string
  - name: resourceGroupName
    type: string
  - name: artifactZipPath
    type: string
  - name: healthCheckPath
    type: string
    default: /api/health
  # A JSON representation of the appsettings to apply to the staging slot.
  - name: appSettingsJson
    type: string
    default: '{}'
  # A marker unique to this deploy, already baked into appSettingsJson's
  # Deploy__DeployedAt entry - see deploy-admin.yml/deploy-content-api.yml/
  # deploy-data-api.yml. Used to confirm the new appsettings/code actually took effect.
  - name: deployedAt
    type: string

steps:
  - template: ../../../../common/ci/tasks/set-appsettings-from-json.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - updating staging slot app settings
      appName: ${{ parameters.appName }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      appSettingsJson: ${{ parameters.appSettingsJson }}
      slotName: deploy

  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - deploying code to staging slot
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        # Allow for multiple retry attempts to upload the zip in case the Kudu site isn't yet ready.
        # We're not using "retryCountOnTaskFailure" because otherwise failures are logged as pipeline errors.
        attempt=1
        maxAttempts=5
        until az webapp deploy \
          --name ${{ parameters.appName }} \
          --resource-group ${{ parameters.resourceGroupName }} \
          --slot deploy \
          --type zip \
          --src-path "${{ parameters.artifactZipPath }}"
        do
          if [ "$attempt" -ge "$maxAttempts" ]; then
            echo "Deploy failed after $maxAttempts attempts."
            exit 1
          fi
          echo "Deploy attempt $attempt failed - retrying in 10s..."
          sleep 10
          attempt=$((attempt + 1))
        done

  # Confirm the staging slot app service has actually restarted by waiting for it to
  # report back this deploy's marker. A successful response here also signifies that
  # the app in this slot is healthy.
  - template: ../../../../common/ci/tasks/wait-for-app-service-restart.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - confirming staging slot has restarted and is healthy
      appName: ${{ parameters.appName }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      slotName: deploy
      healthCheckPath: ${{ parameters.healthCheckPath }}
      deployedAt: ${{ parameters.deployedAt }}
