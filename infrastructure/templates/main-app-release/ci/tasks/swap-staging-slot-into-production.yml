parameters:
  - name: serviceConnection
    type: string
  - name: displayNamePrefix
    type: string
  - name: appName
    type: string
  - name: resourceGroupName
    type: string
  - name: healthCheckPath
    type: string
    default: /api/health
  # The marker generated for the deploy that was made to the staging slot. Used to confirm that
  # the main slot is serving that deploy once the swap completes.
  - name: deployedAt
    type: string

steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - swapping staging slot into main slot
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        az webapp deployment slot swap \
          --name ${{ parameters.appName }} \
          --resource-group ${{ parameters.resourceGroupName }} \
          --slot deploy \
          --target-slot production

  # Confirm that the main slot is now serving the deploy that was in the staging slot.
  - template: ../../../../common/ci/tasks/wait-for-app-service-restart.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - confirming main slot is serving the swapped-in deployment and is healthy
      appName: ${{ parameters.appName }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      healthCheckPath: ${{ parameters.healthCheckPath }}
      deployedAt: ${{ parameters.deployedAt }}
      maxAttempts: 20
