parameters:
  - name: serviceConnection
    type: string
  - name: displayNamePrefix
    type: string
  - name: templateFile
    type: string
  - name: paramFile
    type: string
  - name: bicepConfigDeployName
    type: string

steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - Get new application-specific appsettings to deploy
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        # A marker unique to this deploy, baked in as the Deploy__DeployedAt
        # appsetting below - see wait-for-app-service-restart.yml.
        deployedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "##vso[task.setvariable variable=deployedAt]$deployedAt"

        az deployment group create \
          --name ${{ parameters.bicepConfigDeployName }} \
          --resource-group $(resourceGroupName) \
          --template-file ${{ parameters.templateFile }} \
          --parameters ${{ parameters.paramFile }} \
          --parameters deployedAt="$deployedAt"

  - template: ../../../../common/ci/tasks/bicep-output-variables.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      deploymentName: ${{ parameters.bicepConfigDeployName }}
