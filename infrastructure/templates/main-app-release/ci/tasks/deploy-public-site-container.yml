parameters:
  - name: serviceConnection
    type: string
  - name: displayNamePrefix
    type: string
  - name: appName
    type: string
  - name: resourceGroupName
    type: string
  - name: containerImage
    type: string
  - name: healthCheckPath
    type: string
    default: /health
  - name: appSettingsJson
    type: string
    default: '{}'
  - name: deployedAt
    type: string
  # Leave blank to target the main slot. Set to a slot name (e.g. "deploy") to target that slot.
  - name: slotName
    type: string
    default: ''

steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - updating ${{ iif(eq(parameters.slotName, ''), 'main slot', 'staging slot') }} container image
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        slotArgs=()
        if [ -n "${{ parameters.slotName }}" ]; then
          slotArgs=(--slot "${{ parameters.slotName }}")
        fi
        az webapp config container set \
          --name ${{ parameters.appName }} \
          --resource-group ${{ parameters.resourceGroupName }} \
          "${slotArgs[@]}" \
          --container-image-name ${{ parameters.containerImage }}

  - template: ../../../../common/ci/tasks/set-appsettings-from-json.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - updating ${{ iif(eq(parameters.slotName, ''), 'main slot', 'staging slot') }} app settings
      appName: ${{ parameters.appName }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      appSettingsJson: ${{ parameters.appSettingsJson }}
      slotName: ${{ parameters.slotName }}

  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - restarting ${{ iif(eq(parameters.slotName, ''), 'main slot', 'staging slot') }} to bring up new code and new app settings together
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        slotArgs=()
        if [ -n "${{ parameters.slotName }}" ]; then
          slotArgs=(--slot "${{ parameters.slotName }}")
        fi
        az webapp restart \
          --name ${{ parameters.appName }} \
          --resource-group ${{ parameters.resourceGroupName }} \
          "${slotArgs[@]}"

  # Confirm the app has actually restarted by waiting for it to report back this
  # deploy's marker. A successful response here also signifies that the app is healthy.
  - template: ../../../../common/ci/tasks/wait-for-app-service-restart.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - confirming ${{ iif(eq(parameters.slotName, ''), 'main slot', 'staging slot') }} has restarted and is healthy
      appName: ${{ parameters.appName }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      slotName: ${{ parameters.slotName }}
      healthCheckPath: ${{ parameters.healthCheckPath }}
      deployedAt: ${{ parameters.deployedAt }}
