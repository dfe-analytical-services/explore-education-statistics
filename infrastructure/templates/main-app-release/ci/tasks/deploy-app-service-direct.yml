parameters:
  - name: serviceConnection
    type: string
  - name: displayNamePrefix
    type: string
  - name: appName
    type: string
  - name: resourceGroupName
    type: string
  - name: artifactZipPath
    type: string
  - name: healthCheckPath
    type: string
    default: '/'
  - name: appSettingsJson
    type: string
    default: '{}'

steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - Update production app settings
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        settingsArgs=()
        while IFS= read -r kv; do
          settingsArgs+=("$kv")
        done < <(echo '${{ parameters.appSettingsJson }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')

        if [ ${#settingsArgs[@]} -gt 0 ]; then
          az webapp config appsettings set \
            --name ${{ parameters.appName }} \
            --resource-group ${{ parameters.resourceGroupName }} \
            --settings "${settingsArgs[@]}"
        else
          echo "No application-specific appsettings to apply - leaving production's existing appsettings untouched."
        fi

  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - Deploy code directly to production
    retryCountOnTaskFailure: 3
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        az webapp deploy \
          --name ${{ parameters.appName }} \
          --resource-group ${{ parameters.resourceGroupName }} \
          --type zip \
          --src-path "${{ parameters.artifactZipPath }}"

  - template: ../../../public-api/ci/tasks/wait-for-endpoint-success.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - Checking production is healthy after appsettings and code deploy
      endpoint: https://${{ parameters.appName }}.azurewebsites.net${{ parameters.healthCheckPath }}
      maxAttempts: 20
