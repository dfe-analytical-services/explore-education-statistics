parameters:
  - name: serviceConnection
    type: string
  - name: displayNamePrefix
    type: string
  - name: appName
    type: string
  - name: resourceGroupName
    type: string
  - name: artifactZipPath
    type: string
  - name: healthCheckPath
    type: string
    default: /api/health
  - name: appSettingsJson
    type: string
    default: '{}'

steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - Update production app settings
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        # Captured via a plain assignment (not a process substitution feeding the while-read
        # loop below) so that a jq parse failure here actually trips `set -e` and fails the
        # task. A process substitution's exit status isn't checked by `set -e`, so a malformed/
        # truncated appSettingsJson value would otherwise silently look identical to a
        # genuinely empty one, below.
        parsedSettings=$(echo '${{ parameters.appSettingsJson }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"') || {
          echo "##vso[task.logissue type=error]Failed to parse appSettingsJson as JSON - see the jq error above. This most likely means the value was truncated or malformed somewhere upstream, not that it's genuinely empty."
          exit 1
        }

        settingsArgs=()
        while IFS= read -r kv; do
          [ -n "$kv" ] && settingsArgs+=("$kv")
        done <<< "$parsedSettings"

        if [ ${#settingsArgs[@]} -gt 0 ]; then
          az webapp config appsettings set \
            --name ${{ parameters.appName }} \
            --resource-group ${{ parameters.resourceGroupName }} \
            --settings "${settingsArgs[@]}"
        else
          echo "No application-specific appsettings to apply - leaving production's existing appsettings untouched."
        fi

  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - Deploy code directly to production
    retryCountOnTaskFailure: 3
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        az webapp deploy \
          --name ${{ parameters.appName }} \
          --resource-group ${{ parameters.resourceGroupName }} \
          --type zip \
          --src-path "${{ parameters.artifactZipPath }}"

  # Wait for the app service restart to begin.
  - template: ../../../public-api/ci/tasks/wait-for-endpoint-result.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - Confirming production has started restarting
      endpoint: https://${{ parameters.appName }}.azurewebsites.net${{ parameters.healthCheckPath }}
      expectedResult: unavailable
      pollingDelaySeconds: 1
      maxAttempts: 30

  # Wait for the app service restart to complete.
  - template: ../../../public-api/ci/tasks/wait-for-endpoint-result.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - Checking production is healthy after appsettings and code deploy
      endpoint: https://${{ parameters.appName }}.azurewebsites.net${{ parameters.healthCheckPath }}
      maxAttempts: 20
