parameters:
  - name: serviceConnection
    type: string
  - name: displayNamePrefix
    type: string
  - name: appName
    type: string
  - name: resourceGroupName
    type: string
  - name: artifactZipPath
    type: string
  - name: healthCheckPath
    type: string
    default: /api/health
  - name: appSettingsJson
    type: string
    default: '{}'
  # A marker unique to this deploy, already baked into appSettingsJson's
  # Deploy__DeployedAt entry - see deploy-admin.yml/deploy-content-api.yml/
  # deploy-data-api.yml. Used to confirm the new appsettings/code actually took effect.
  - name: deployedAt
    type: string

steps:
  - template: ../../../../common/ci/tasks/set-appsettings-from-json.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - updating production app settings
      appName: ${{ parameters.appName }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      appSettingsJson: ${{ parameters.appSettingsJson }}

  - task: AzureCLI@2
    displayName: ${{ parameters.displayNamePrefix }} - Deploy code directly to production
    retryCountOnTaskFailure: 3
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        az webapp deploy \
          --name ${{ parameters.appName }} \
          --resource-group ${{ parameters.resourceGroupName }} \
          --type zip \
          --src-path "${{ parameters.artifactZipPath }}"

  # Confirm the app service has actually restarted by waiting for it to report back this
  # deploy's marker.
  - template: ../../../../common/ci/tasks/wait-for-app-service-restart.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - waiting for the app service in the production slot to restart.
      appName: ${{ parameters.appName }}
      resourceGroupName: ${{ parameters.resourceGroupName }}
      healthCheckPath: ${{ parameters.healthCheckPath }}
      deployedAt: ${{ parameters.deployedAt }}
      pollingDelaySeconds: 1
      maxAttempts: 60

  # Confirm that the restarted app service is healthy.
  - template: ../../../public-api/ci/tasks/wait-for-endpoint-result.yml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
      displayName: ${{ parameters.displayNamePrefix }} - waiting for the app service in the production slot to restart and report healthy.
      endpoint: https://${{ parameters.appName }}.azurewebsites.net${{ parameters.healthCheckPath }}
      maxAttempts: 20
