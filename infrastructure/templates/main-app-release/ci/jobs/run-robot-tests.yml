parameters:
  - name: serviceConnection
    type: string
  - name: testEnvironment
    type: string
  - name: dependsOn
    type: object
    default: []

jobs:
  - job: RunRobotTests
    displayName: Run Robot UI tests
    dependsOn: ${{ parameters.dependsOn }}
    timeoutInMinutes: 160
    cancelTimeoutInMinutes: 10
    pool: ees-ubuntu2604-large-v2
    workspace:
      clean: all
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1
        fetchTags: false

      - template: ../../../../../azure-pipelines-install-python.yml

      - task: AzureKeyVault@2
        displayName: Azure Key Vault - $(subscription)-kv-ees-01
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          KeyVaultName: $(subscription)-kv-ees-01
          SecretsFilter: ees-test-ADMIN-PASSWORD,ees-test-ANALYST-PASSWORD,ees-test-expiredinvite-password,ees-test-NOINVITE-PASSWORD,ees-test-PENDINGINVITE-PASSWORD,ees-alerts-slackapptoken
          RunAsPreJob: true

      - task: PythonScript@0
        displayName: Public UI tests
        inputs:
          pythonInterpreter: $(Agent.TempDirectory)/venv/bin/python
          scriptPath: tests/robot-tests/scripts/run_tests_pipeline.py
          arguments: --admin-pass '"$(ees-test-ADMIN-PASSWORD)"' --analyst-pass '"$(ees-test-ANALYST-PASSWORD)"' --expiredinvite-pass '"$(ees-test-expiredinvite-password)"' --noinvite-pass '"$(ees-test-NOINVITE-PASSWORD)"' --pendinginvite-pass '"$(ees-test-PENDINGINVITE-PASSWORD)"' --env "${{ parameters.testEnvironment }}" --file "tests/general_public" --processes 4 --rerun-attempts 1
          workingDirectory: tests/robot-tests
        env:
          SLACK_APP_TOKEN: $(ees-alerts-slackapptoken)

      - task: PublishTestResults@2
        displayName: Publish UI Public Test Results
        condition: succeededOrFailed()
        inputs:
          testResultsFiles: tests/robot-tests/test-results/xunit.xml
          failTaskOnFailedTests: true
          testRunTitle: Public UI Tests
