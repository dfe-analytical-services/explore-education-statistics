parameters:
  - name: serviceConnection
    type: string
  - name: environment
    type: string
  - name: bicepParamFile
    type: string
  - name: dependsOn
    type: object
    default: []

jobs:
  - deployment: DeployPublicSite
    displayName: Deploy Public Site
    dependsOn: ${{ parameters.dependsOn }}
    environment: ${{ parameters.environment }}
    variables:
      templateFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/public-site/public-site-appsettings.bicep
      paramFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/public-site/parameters/appsettings-${{ parameters.bicepParamFile }}.bicepparam
      bicepConfigDeployName: PublicSiteBicepConfig$(Build.BuildNumber)
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            # No artifact download needed - the Public Site's build output is a Docker image,
            # already pushed to the container registry by the build pipeline.
            - download: none

            - template: ../tasks/get-new-appsettings.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                displayNamePrefix: Public Site
                templateFile: $(templateFile)
                paramFile: $(paramFile)
                bicepConfigDeployName: $(bicepConfigDeployName)

            # The container image is updated BEFORE the appsettings below, so that by the time the
            # app restarts with this deploy's "deployedAt" marker, it is already configured to run the
            # new image. Were the appsettings applied first, the app could restart and report the new
            # marker while still running the old image, letting the health check below pass early.
            - task: AzureCLI@2
              displayName: Public Site - Update container image
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  az webapp config container set \
                    --name $(subscription)-as-ees-public-site \
                    --resource-group $(resourceGroupName) \
                    --container-image-name eesacr.azurecr.io/ees-public-frontend:$(resources.pipeline.MainBuild.runName)

            - template: ../../../../common/ci/tasks/set-appsettings-from-json.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                displayName: Public Site - updating app settings
                appName: $(subscription)-as-ees-public-site
                resourceGroupName: $(resourceGroupName)
                appSettingsJson: $(appSettings)

            # Confirm the app has actually restarted by waiting for it to report back this
            # deploy's marker. A successful response here also signifies that the app is healthy.
            - template: ../../../../common/ci/tasks/wait-for-app-service-restart.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                displayName: Public Site - confirming production has restarted and is healthy
                appName: $(subscription)-as-ees-public-site
                resourceGroupName: $(resourceGroupName)
                healthCheckPath: /health
                deployedAt: $(deployedAt)
                pollingDelaySeconds: 1
                maxAttempts: 60
