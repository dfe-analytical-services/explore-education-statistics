parameters:
  - name: serviceConnection
    type: string
  - name: environment
    type: string
  - name: bicepParamFile
    type: string
  - name: dependsOn
    type: object
    default: []

jobs:
  - deployment: DeployPublicSite
    displayName: Deploy Public Site
    dependsOn: ${{ parameters.dependsOn }}
    environment: ${{ parameters.environment }}
    variables:
      templateFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/public-site/public-site-appsettings.bicep
      paramFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/public-site/parameters/appsettings-${{ parameters.bicepParamFile }}.bicepparam
      bicepConfigDeployName: PublicSiteBicepConfig$(Build.BuildNumber)
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - template: ../../../../common/ci/tasks/get-resource-names.yml
              parameters:
                environment: ${{ parameters.environment }}

            # No artifact download needed - the Public Site's build output is a Docker image,
            # already pushed to the container registry by the build pipeline.
            - download: none

            - task: AzureCLI@2
              displayName: Public Site - Get new application-specific appsettings to deploy
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e

                  # A marker unique to this deploy, provided via an appsetting to the service
                  # so that we can tell when a newly deployed service has fired up - see
                  # wait-for-app-service-restart.yml.
                  deployedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  echo "##vso[task.setvariable variable=deployedAt]$deployedAt"

                  az deployment group create \
                    --name $(bicepConfigDeployName) \
                    --resource-group $(resourceGroupName) \
                    --template-file $(templateFile) \
                    --parameters $(paramFile) \
                    --parameters deployedAt="$deployedAt"

            - template: ../../../../common/ci/tasks/bicep-output-variables.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                deploymentName: $(bicepConfigDeployName)

            - template: ../../../../common/ci/tasks/set-appsettings-from-json.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                displayName: Public Site - updating app settings
                appName: $(resourceNames.publicSite.appService)
                resourceGroupName: $(resourceGroupName)
                appSettingsJson: $(appSettings)

            # Applying the new appsettings above and then updating the container image here means
            # the restart below picks up both together, rather than risking two restarts in a row.
            - task: AzureCLI@2
              displayName: Public Site - Update container image
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  az webapp config container set \
                    --name $(resourceNames.publicSite.appService) \
                    --resource-group $(resourceGroupName) \
                    --container-image-name $(resourceNames.acr.serverName).azurecr.io/ees-public-frontend:$(resources.pipeline.MainBuild.runName) \
                    --container-registry-url https://$(resourceNames.acr.serverName).azurecr.io

            - task: AzureCLI@2
              displayName: Public Site - Restart app to pull new image
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  az webapp restart \
                    --name $(resourceNames.publicSite.appService) \
                    --resource-group $(resourceGroupName)

            # Confirm the app has actually restarted by waiting for it to report back this
            # deploy's marker. A successful response here also signifies that the app is healthy.
            - template: ../../../../common/ci/tasks/wait-for-app-service-restart.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                displayName: Public Site - confirming production has restarted and is healthy
                appName: $(resourceNames.publicSite.appService)
                resourceGroupName: $(resourceGroupName)
                healthCheckPath: /health
                deployedAt: $(deployedAt)
                pollingDelaySeconds: 1
                maxAttempts: 60
