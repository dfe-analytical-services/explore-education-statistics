parameters:
  - name: serviceConnection
    type: string
  - name: environment
    type: string
  - name: bicepParamFile
    type: string
  - name: basicAuthEnabled
    type: boolean
  - name: slotSwappingBehaviour
    type: string
    default: Default
  - name: dependsOn
    type: object
    default: []

jobs:
  - deployment: DeployPublicSite
    displayName: Deploy Public Site
    dependsOn: ${{ parameters.dependsOn }}
    environment: ${{ parameters.environment }}
    variables:
      templateFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/public-site/public-site-appsettings.bicep
      paramFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/public-site/parameters/appsettings-${{ parameters.bicepParamFile }}.bicepparam
      bicepConfigDeployName: PublicSiteBicepConfig$(Build.BuildNumber)
      containerImage: $(resourceNames.acr.serverName).azurecr.io/ees-public-frontend:$(resources.pipeline.MainBuild.runName)
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - template: ../../../../common/ci/tasks/choose-elz-or-legacy-bicepparam-files.yml

            - template: ../../../../common/ci/tasks/get-resource-names.yml
              parameters:
                environment: ${{ parameters.environment }}

            # No artifact download needed - the Public Site's build output is a Docker image,
            # already pushed to the container registry by the build pipeline.
            - download: none

            - template: ../tasks/get-new-appsettings.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                displayNamePrefix: Public Site
                templateFile: $(templateFile)
                paramFile: $(paramFile)
                bicepConfigDeployName: $(bicepConfigDeployName)
                additionalParameters: basicAuthEnabled=${{ parameters.basicAuthEnabled }}

            - ${{ if or(eq(parameters.slotSwappingBehaviour, 'Swap'), and(ne(parameters.slotSwappingBehaviour, 'No swap'), or(eq(parameters.environment, 'Pre-Prod'), eq(parameters.environment, 'Prod')))) }}:
                - template: ../tasks/deploy-public-site-container.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    displayNamePrefix: Public Site
                    appName: $(resourceNames.publicSite.appService)
                    resourceGroupName: $(resourceGroupName)
                    containerImage: $(containerImage)
                    appSettingsJson: $(appSettings)
                    healthCheckPath: /health
                    deployedAt: $(deployedAt)
                    slotName: deploy

                - template: ../tasks/swap-staging-slot-into-production.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    displayNamePrefix: Public Site
                    appName: $(resourceNames.publicSite.appService)
                    resourceGroupName: $(resourceGroupName)
                    healthCheckPath: /health
                    deployedAt: $(deployedAt)
            - ${{ else }}:
                - template: ../tasks/deploy-public-site-container.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    displayNamePrefix: Public Site
                    appName: $(resourceNames.publicSite.appService)
                    resourceGroupName: $(resourceGroupName)
                    containerImage: $(containerImage)
                    appSettingsJson: $(appSettings)
                    healthCheckPath: /health
                    deployedAt: $(deployedAt)
