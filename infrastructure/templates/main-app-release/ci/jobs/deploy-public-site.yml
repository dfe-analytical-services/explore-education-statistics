parameters:
  - name: serviceConnection
    type: string
  - name: environment
    type: string
  - name: bicepParamFile
    type: string
  - name: dependsOn
    type: object
    default: []

jobs:
  - deployment: DeployPublicSite
    displayName: Deploy Public Site
    dependsOn: ${{ parameters.dependsOn }}
    environment: ${{ parameters.environment }}
    variables:
      templateFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/public-site/public-site-appsettings.bicep
      paramFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/public-site/parameters/appsettings-${{ parameters.bicepParamFile }}.bicepparam
      bicepConfigDeployName: PublicSiteBicepConfig$(Build.BuildNumber)
    strategy:
      runOnce:
        deploy:
          steps:
            # No artifact download needed - the Public Site's build output is a Docker image,
            # already pushed to the container registry by the build pipeline.
            - download: none

            - task: AzureCLI@2
              displayName: Public Site - Get new application-specific appsettings to deploy
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  az deployment group create \
                    --name $(bicepConfigDeployName) \
                    --resource-group $(resourceGroupName) \
                    --template-file $(templateFile) \
                    --parameters $(paramFile)

            - template: ../../../../common/ci/tasks/bicep-output-variables.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                deploymentName: $(bicepConfigDeployName)

            - template: ../../../../common/ci/tasks/set-appsettings-from-json.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                displayName: Public Site - updating app settings
                appName: $(subscription)-as-ees-public-site
                resourceGroupName: $(resourceGroupName)
                appSettingsJson: $(appSettings)

            # Applying the new appsettings above and then updating the container image here means
            # the restart below picks up both together, rather than risking two restarts in a row.
            - task: AzureCLI@2
              displayName: Public Site - Update container image
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  az webapp config container set \
                    --name $(subscription)-as-ees-public-site \
                    --resource-group $(resourceGroupName) \
                    --container-image-name eesacr.azurecr.io/ees-public-frontend:$(resources.pipeline.MainBuild.runName) \
                    --container-registry-url https://eesacr.azurecr.io

            - task: AzureCLI@2
              displayName: Public Site - Restart app to pull new image
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  az webapp restart \
                    --name $(subscription)-as-ees-public-site \
                    --resource-group $(resourceGroupName)
                  
                  # Give the site a chance to restart prior to polling its health endpoint.
                  # This minimises the risk of performing a health check against an
                  # already-running version of the site prior to a restart occurring.
                  #
                  # In the future we should provide the same mechanism to the public site
                  # as we do for Admin, Content API and Data API with their deployedAt check.
                  sleep 30

                  # TODO EES-7734 - provide deployedAt health check enhancement to this
                  # app deploy to ensure we're receiving successful health checks from
                  # correct version of this app.  In the meantime, sleep to give the
                  # restart a chance to begin.
                  sleep 30  

            - template: ../../../public-api/ci/tasks/wait-for-endpoint-result.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                displayName: Public Site - Checking app is healthy after deploy
                endpoint: https://$(subscription)-as-ees-public-site.azurewebsites.net/health
                maxAttempts: 20
