parameters:
  - name: serviceConnection
    type: string
  - name: environment
    type: string
  - name: bicepParamFile
    type: string
  - name: slotSwappingBehaviour
    type: string
    default: Default

jobs:
  - deployment: DeployAdmin
    displayName: Deploy Admin
    environment: ${{ parameters.environment }}
    variables:
      templateFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/admin/admin-bicep-config.bicep
      paramFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/admin/parameters/appsettings-${{ parameters.bicepParamFile }}.bicepparam
      bicepConfigDeployName: AdminBicepConfig$(Build.BuildNumber)
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - download: MainBuild
              displayName: Download Admin artifact
              artifact: admin

            - task: AzureCLI@2
              displayName: Admin - Deploy appsettings config Bicep
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  az deployment group create \
                    --name $(bicepConfigDeployName) \
                    --resource-group $(resourceGroupName) \
                    --template-file $(templateFile) \
                    --parameters $(paramFile)

            - template: ../../../../common/ci/tasks/bicep-output-variables.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                deploymentName: $(bicepConfigDeployName)

            # Database migrations run as part of Admin's startup, so by the time the staging
            # slot (or production, on the direct path) reports healthy here, they've already
            # run successfully. This job intentionally stops right after that health check -
            # see SwapAdminIntoProduction below - so that services waiting on Admin (via
            # deployAdminFirst) can start as soon as migrations are done, without also waiting
            # for the slot swap itself to complete.
            - ${{ if or(eq(parameters.slotSwappingBehaviour, 'Swap'), and(ne(parameters.slotSwappingBehaviour, 'No swap'), or(eq(parameters.environment, 'Pre-Prod'), eq(parameters.environment, 'Prod')))) }}:
                - template: ../tasks/deploy-app-service-to-staging-slot.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    displayNamePrefix: Admin
                    appName: $(subscription)-as-ees-admin
                    resourceGroupName: $(resourceGroupName)
                    artifactZipPath: $(Pipeline.Workspace)/MainBuild/admin/GovUk.Education.ExploreEducationStatistics.Admin.zip
                    appSettingsJson: $(appSettings)
            - ${{ else }}:
                - template: ../tasks/deploy-app-service-direct.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    displayNamePrefix: Admin
                    appName: $(subscription)-as-ees-admin
                    resourceGroupName: $(resourceGroupName)
                    artifactZipPath: $(Pipeline.Workspace)/MainBuild/admin/GovUk.Education.ExploreEducationStatistics.Admin.zip
                    appSettingsJson: $(appSettings)

  # Only exists when slot swapping is actually in play for this run - see deploy-app-service.yml
  # for the equivalent decision used by Content API/Data API. Kept as its own job (rather than
  # more steps in DeployAdmin above) specifically so it does NOT block services that depend on
  # Admin's migrations having run, not on the swap having completed.
  - ${{ if or(eq(parameters.slotSwappingBehaviour, 'Swap'), and(ne(parameters.slotSwappingBehaviour, 'No swap'), or(eq(parameters.environment, 'Pre-Prod'), eq(parameters.environment, 'Prod')))) }}:
      - deployment: SwapAdminIntoProduction
        displayName: Swap Admin Into Production
        dependsOn: DeployAdmin
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: ../tasks/swap-staging-slot-into-production.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    displayNamePrefix: Admin
                    appName: $(subscription)-as-ees-admin
                    resourceGroupName: $(resourceGroupName)
