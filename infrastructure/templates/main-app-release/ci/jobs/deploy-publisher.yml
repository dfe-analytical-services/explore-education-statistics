parameters:
  - name: serviceConnection
    type: string
  - name: environment
    type: string
  - name: bicepParamFile
    type: string
  - name: dependsOn
    type: object
    default: []

jobs:
  - deployment: DeployPublisher
    displayName: Deploy Publisher
    dependsOn: ${{ parameters.dependsOn }}
    environment: ${{ parameters.environment }}
    variables:
      templateFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/publisher/publisher-appsettings.bicep
      paramFile: $(Build.SourcesDirectory)/infrastructure/templates/main-app-release/appsettings/publisher/parameters/appsettings-${{ parameters.bicepParamFile }}.bicepparam
      bicepConfigDeployName: PublisherBicepConfig$(Build.BuildNumber)
    strategy:
      runOnce:
        deploy:
          steps:
            - download: MainBuild
              displayName: Download Publisher artifact
              artifact: publisher

            - task: AzureCLI@2
              displayName: Publisher - Get new application-specific appsettings to deploy
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e

                  # A marker unique to this deploy, baked in as the Deploy__DeployedAt
                  # appsetting below - see wait-for-app-service-restart.yml.
                  deployedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  echo "##vso[task.setvariable variable=deployedAt]$deployedAt"

                  az deployment group create \
                    --name $(bicepConfigDeployName) \
                    --resource-group $(resourceGroupName) \
                    --template-file $(templateFile) \
                    --parameters $(paramFile) \
                    --parameters deployedAt="$deployedAt"

            - template: ../../../../common/ci/tasks/bicep-output-variables.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                deploymentName: $(bicepConfigDeployName)

            - template: ../tasks/deploy-function-app.yml
              parameters:
                serviceConnection: ${{ parameters.serviceConnection }}
                displayNamePrefix: Publisher
                appName: $(subscription)-fa-ees-publisher
                resourceGroupName: $(resourceGroupName)
                artifactZipPath: $(Pipeline.Workspace)/MainBuild/publisher/GovUk.Education.ExploreEducationStatistics.Publisher.zip
                appSettingsJson: $(appSettings)
                healthCheckPath: /api/health
                deployedAt: $(deployedAt)
