#
# This Task switches the job's "paramFile" variable to the ELZ version of the same param file when the environment's
# variable group sets "elz" to "true".
#
# ELZ param files live in an "elz" folder beside the legacy ones, with the same file names, e.g.
# "parameters/elz/main-dev.bicepparam" for "parameters/main-dev.bicepparam". Each one extends its legacy file and
# sets "elz = true", so that the templates use the naming convention for the DfE Enterprise Landing Zone (ELZ)
# subscriptions.
#
# Include this after the job's checkout and before anything that uses $(paramFile).
#
steps:
  - task: Bash@3
    displayName: Select param file
    env:
      # Left as the literal text "$(elz)" if the variable group doesn't define it, so only "true" (in any case)
      # opts in to ELZ.
      ELZ: $(elz)
      PARAM_FILE: $(paramFile)
    inputs:
      targetType: inline
      script: |
        set -eo pipefail

        if [ "${ELZ,,}" != "true" ]; then
          echo "Using legacy param file $PARAM_FILE"
          exit 0
        fi

        elzParamFile="$(dirname "$PARAM_FILE")/elz/$(basename "$PARAM_FILE")"

        if [ ! -f "$elzParamFile" ]; then
          echo "##vso[task.logissue type=error]ELZ param file $elzParamFile not found."
          exit 1
        fi

        echo "Using ELZ param file $elzParamFile"
        echo "##vso[task.setvariable variable=paramFile]$elzParamFile"
